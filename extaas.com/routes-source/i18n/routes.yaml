# routes.yaml
# -----------------------------
# Central YAML file containing all translations and page metadata.
# Structure:
# /<pathname>:
#   group: <group name>            # Required if schema is true for sitemap grouping
#   schema: true/false             # If true, page is added to sitemap
#   en:
#     seo:
#       title: Page Title          # Required if schema is true
#       description: Page description
#       keywords: comma-separated keywords (optional)
#     header: Header text
#     btn: Button label
#   et:
#     seo:
#       title: Lehe pealkiri
#       description: Lehe kirjeldus
#     header: Pealkiri
#     btn: Nupp
#
# External links (not added to sitemap):
# _<external_link_id>:
#   group: help
#   url: https://example.com
#   en:
#     title: External title
#     description: External description
#   et:
#     title: Välislink pealkiri
#     description: Välislink kirjeldus


# --- URL Elements ---
/: # Home
  group: main
  schema: true
  sitemap:
    lastmod: 2026-03-13
    priority: 1.0
    changefreq: yearly
  en:
    seo:
      title: Solutions That Create Value
      description: Discover how Extaas transforms your ideas into working web solutions, offering IT support and tailored technical services designed to meet your exact needs.
      keywords: Extaas, web development, IT support, Svelte, web solutions, technical consulting, custom solutions, Osaühing X
    header: Hello world!
    btn: Button
    agree: User Agreement
    box: Box
    random: Random
  et:
    seo:
      title: Lahendused, mis loovad väärtust
      description: Avasta, kuidas Extaas aitab sinu ideedest ja projektidest kujundada toimivad veebilahendused ning pakkuda IT-tuge ja kohandatud tehnilisi lahendusi, mis vastavad täpselt sinu vajadustele.
      keywords: Extaas, veebiarendus, IT-tugi, Svelte, veebilahendused, tehniline konsultatsioon, kohandatud lahendused, Osaühing X
    header: Tere maailm!
    btn: Nupp
    agree: Kasutajaleping
    box: Karp
    random: Suvaline



/legal_documents:
  group: main
  schema: true
  sitemap:
    lastmod: 2026-03-04
    priority: 1.0
    changefreq: yearly
  en:
    seo:
      title: Legal Documents
      description: Explore all our legal documents, including privacy policies, terms of service, and sales agreements, to understand your rights and obligations.
      keywords: legal documents, privacy policy, terms of service, terms of sale, user agreement, digital services, compliance, online contracts
  et:
    seo:
      title: Õiguslikud dokumendid
      description: Tutvuge kõigi meie õiguslike dokumentidega, sealhulgas privaatsuspoliitikad, teenustingimused ja müügitingimused, et mõista oma õigusi ja kohustusi.
      keywords: õiguslikud dokumendid, privaatsuspoliitika, teenustingimused, müügitingimused, kasutajaleping, digiteenused, õiguslik, lepingud









# --- Errors ---
error:
  en:
    "404": The page you are looking for does not exist. How you got here is a mystery.
    "500": "It appears that a certain function on the site is not functioning correctly due to unknown circumstances."
  et:
    "404": "Lehte, mida otsite, pole olemas. Kuidas te siia sattusite, on mõistatus."
    "500": "Paistab, et teatud funktsioon saidil ei tööta tundmatutel asjaoludel korralikult."



