<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Extaas workspace flow</title>
  <desc id="desc">A simplified flow from extaas.com to workspace.extaas.com, tenant domains and shared modules.</desc>
  <rect width="1200" height="520" fill="#050505"/>
  <g fill="none" stroke="#d9a42f" stroke-width="4" opacity=".9">
    <path d="M260 260h180"/>
    <path d="M760 260h180"/>
    <path d="M600 330v80"/>
  </g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(60 150)">
      <rect width="220" height="170" rx="10" fill="#111" stroke="#d9a42f"/>
      <text x="24" y="54" fill="#fff" font-size="30" font-weight="700">extaas.com</text>
      <text x="24" y="92" fill="#bbb" font-size="18">main domain</text>
      <text x="24" y="122" fill="#bbb" font-size="18">read, docs, payment entry</text>
    </g>
    <g transform="translate(470 120)">
      <rect width="260" height="220" rx="10" fill="#151515" stroke="#d9a42f"/>
      <text x="24" y="58" fill="#fff" font-size="30" font-weight="700">Workspace</text>
      <text x="24" y="96" fill="#bbb" font-size="18">account, invoices, projects</text>
      <text x="24" y="126" fill="#bbb" font-size="18">integrations and modules</text>
      <text x="24" y="170" fill="#d9a42f" font-size="20" font-weight="700">workspace.extaas.com</text>
    </g>
    <g transform="translate(920 150)">
      <rect width="220" height="170" rx="10" fill="#111" stroke="#d9a42f"/>
      <text x="24" y="54" fill="#fff" font-size="30" font-weight="700">Tenant DNS</text>
      <text x="24" y="92" fill="#bbb" font-size="18">public customer portal</text>
      <text x="24" y="122" fill="#bbb" font-size="18">booking, pages, store</text>
    </g>
    <g transform="translate(430 410)">
      <rect width="340" height="70" rx="10" fill="#0d0d0d" stroke="#555"/>
      <text x="24" y="44" fill="#fff" font-size="22" font-weight="700">Shared modules and data rules</text>
    </g>
  </g>
</svg>
